stages:
  - build
  - publish

variables:
  GIT_DEPTH: 0

build:
  stage: build
  image: python:3.11-slim
  script:
    - python -m pip install --upgrade build
    - python -m build
  artifacts:
    paths:
      - dist/

publish:
  stage: publish
  image: python:3.11-slim
  needs:
    - build
  variables:
    TWINE_USERNAME: __token__
    TWINE_PASSWORD: $PYPI_API_TOKEN
  script:
    - python -m pip install --upgrade twine
    - python -m twine upload dist/*
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+/'
