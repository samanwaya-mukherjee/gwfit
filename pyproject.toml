[project]
name = "GWFIT"
dynamic = ["version"]
description = "Gravitational Waveform Integration Tools"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.10"
authors = [
    {name = "Samanwaya Mukherjee"}
]
dependencies = [
    "numpy",
    "scipy",
    "sxs",
    "matplotlib",
]

[project.optional-dependencies]
legacy = [
    "h5py",
    "pycbc",
]

[build-system]
requires = ["setuptools>=68", "setuptools_scm>=8"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools_scm]